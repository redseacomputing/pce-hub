# permissions for end users to edit nis2compliancereports.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pce-hub
    app.kubernetes.io/managed-by: kustomize
  name: nis2compliancereport-editor-role
rules:
- apiGroups:
  - pce.redseacomputing.github.com.redseacomputing.github.com
  resources:
  - nis2compliancereports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pce.redseacomputing.github.com.redseacomputing.github.com
  resources:
  - nis2compliancereports/status
  verbs:
  - get
