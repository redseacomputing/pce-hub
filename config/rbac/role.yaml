---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pce.redseacomputing.github.com
  resources:
  - nis2compliancereports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pce.redseacomputing.github.com
  resources:
  - nis2compliancereports/finalizers
  verbs:
  - update
- apiGroups:
  - pce.redseacomputing.github.com
  resources:
  - nis2compliancereports/status
  verbs:
  - get
  - patch
  - update
