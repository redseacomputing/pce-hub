---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: nis2compliancereports.pce.redseacomputing.github.com
spec:
  group: pce.redseacomputing.github.com
  names:
    kind: Nis2ComplianceReport
    listKind: Nis2ComplianceReportList
    plural: nis2compliancereports
    singular: nis2compliancereport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.overallStatus
      name: Overall Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Nis2ComplianceReport ist das Schema für die Custom Resource der
          Policy Crosswalk Engine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Nis2ComplianceReportSpec definiert den gewünschten Zustand
              des Nis2ComplianceReport.
            properties:
              customMappingConfigMapRef:
                description: |-
                  CustomMappingConfigMapRef ist eine optionale benutzerdefinierte Mapping-Definition.
                  Wird diese nicht angegeben oder ist sie fehlerhaft, greift die Engine automatisch auf den einkompilierten Default-Katalog zurück.
                properties:
                  key:
                    description: 'Key innerhalb der ConfigMap, der die YAML-Definition
                      enthält (Default: "mapping.yaml")'
                    type: string
                  name:
                    description: Name der ConfigMap
                    type: string
                required:
                - name
                type: object
              scanConfigMapKey:
                description: 'ScanConfigMapKey ist der Key innerhalb der Scan-ConfigMap
                  (Default: "oscal").'
                type: string
              scanConfigMapRef:
                description: ScanConfigMapRef verweist auf die Quelle der OSCAL-Scan-Daten
                  (z. B. eine ConfigMap von Kubescape/Falco/Velero).
                type: string
              threatConfigMapKey:
                description: 'ThreatConfigMapKey ist der Key innerhalb der Threat-ConfigMap
                  (Default: "threat").'
                type: string
              threatConfigMapRef:
                description: |-
                  ThreatConfigMapRef verweist optional auf die Falco-Threat-Quelle des Spokes
                  (aggregierte Laufzeit-Anomalien). Fehlt sie, bleibt ActiveThreatCount
                  undefiniert (keine Evidenz) - das ist KEINE Degradation.
                type: string
            required:
            - scanConfigMapRef
            type: object
          status:
            description: Nis2ComplianceReportStatus definiert den beobachteten Zustand
              nach der Engine-Ausführung.
            properties:
              activeThreatCount:
                description: ActiveThreatCount spiegelt aktive Laufzeit-Anomalien
                  (Falco), ohne Remediation.
                format: int32
                type: integer
              articleSummaries:
                description: ArticleSummaries enthält die feingranulare Zusammenfassung
                  pro NIS2-Artikel.
                items:
                  description: ArticleComplianceSummary fasst den Compliance-Status
                    für einen einzelnen NIS2-Artikel zusammen.
                  properties:
                    article:
                      description: Article ist der NIS2-Paragraph (z. B. "Art.21(2)f_Encryption")
                      type: string
                    status:
                      description: Status beschreibt die Gesamtbewertung für diesen
                        Artikel (Satisfied, Unsatisfied, Unknown)
                      enum:
                      - Satisfied
                      - Unsatisfied
                      - Unknown
                      - NotApplicable
                      type: string
                    totalFindings:
                      description: TotalFindings ist die Anzahl aller zugeordneten
                        Findings
                      type: integer
                    unsatisfiedFindings:
                      description: UnsatisfiedFindings ist die Anzahl der fehlgeschlagenen
                        Findings
                      type: integer
                  required:
                  - article
                  - status
                  - totalFindings
                  - unsatisfiedFindings
                  type: object
                type: array
              conditions:
                description: Conditions repräsentiert die Standard-Kubernetes-Conditions
                  (z. B. SpokeAuditReady, Ready).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kubescapeScore:
                description: KubescapeScore ist der aggregierte Benchmark-Score des
                  letzten Spoke-Audits (0-100).
                format: int32
                type: integer
              lastEvaluated:
                description: LastEvaluated zeigt den Zeitstempel der letzten Auswertung.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration ist die Generation, deren Spec zuletzt
                  ausgewertet wurde.
                format: int64
                type: integer
              overallStatus:
                description: OverallStatus gibt den aggregierten Gesamtstatus an.
                enum:
                - Satisfied
                - Unsatisfied
                - Unknown
                type: string
              phase:
                description: |-
                  Phase beschreibt den aktuellen Zustand der Verarbeitung (Pending, Processing, Completed, Degraded, Failed).
                  Degraded = Spoke nicht erreichbar / Scan-Daten unvollständig, Retry läuft.
                enum:
                - Pending
                - Processing
                - Completed
                - Degraded
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
